# ─────────────────────────────────────────────────────────────
# DECISION NEEDED (issue #77): this project currently carries BOTH
# Netlify and Vercel configs. Pick ONE platform for the manager web
# portal and delete the other file. The app uses HashRouter, so the
# SPA redirects/rewrites below are not strictly required.
# ─────────────────────────────────────────────────────────────
[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"

[[headers]]
  for = "/assets/*.mjs"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"

[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Content-Type = "text/css; charset=utf-8"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
