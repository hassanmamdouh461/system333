<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1f2937" />
    <title>Engaz Reports - تقارير المبيعات</title>

    <!--
      Content-Security-Policy. This portal holds no inline script of its own: Vite emits the
      bundle as an external module and there is no font loader here, so `script-src 'self'` is
      achievable without 'unsafe-inline'. React and framer-motion set styles through the CSSOM,
      which is why style-src keeps 'unsafe-inline' — that is a far smaller hole than script.

      Deliberately narrower than a default allow:
        * object-src/base-uri/frame-ancestors/form-action close the classic injection pivots.
        * connect-src names the reports worker, so injected markup cannot exfiltrate the
          snapshot to an arbitrary host.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self';
               style-src 'self' 'unsafe-inline';
               img-src 'self' data:;
               font-src 'self' data:;
               connect-src 'self' https://api-reports.engaz.tech;
               object-src 'none';
               base-uri 'self';
               form-action 'none';
               frame-ancestors 'none'"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
