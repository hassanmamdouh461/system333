# Engaz Reports Worker
# Deploys cloudflare/d1-reports-worker.js to api-reports.engaz.tech, bound to its OWN
# isolated D1 database (engaz-reports-db) — fully separate from the production POS
# database. The reports portal (reporting.engaz.tech) calls this worker for analytics.
#
# Setup (once):
#   npx wrangler d1 create engaz-reports-db   # paste returned id below
#   npx wrangler secret put REPORTS_API_KEY   # shared X-API-Key the desktop POS uses
# Deploy:
#   npx wrangler deploy -c wrangler-reports.toml

name = "engaz-reports-proxy"
main = "cloudflare/d1-reports-worker.js"
compatibility_date = "2025-01-01"

# Off, and deliberately so. With workers_dev on, this worker is also published at
# engaz-reports-proxy.<subdomain>.workers.dev — a second public URL bound to the same D1
# database, outside every rule scoped to api-reports.engaz.tech (Access policies, WAF and
# rate-limit rules) and outside anything watching that hostname. One hostname means one
# place to secure and one place to look.
workers_dev = false

# The reports worker lives on its own API subdomain so it is fully isolated from the
# production POS worker (api.engaz.tech). If the route conflicts, remove `routes` and use:
#   npx wrangler routes add api-reports.engaz.tech/* engaz-reports-proxy --zone engaz.tech
routes = [
  { pattern = "api-reports.engaz.tech/*", zone_name = "engaz.tech" },
]

# Isolated reports database. Create once:
#   npx wrangler d1 create engaz-reports-db
# then paste the returned database_id below.
[[d1_databases]]
binding = "DB"
database_name = "engaz-reports-db"
database_id = "8d6a9587-084e-4609-8e39-4b0a0589556b"

# ── Write key ────────────────────────────────────────────────────────────────────────
# Held ONLY by the desktop POS main process. Never by any browser bundle.
#
#   1. npx wrangler secret put REPORTS_API_KEY
#   2. put the same value in the ROOT .env as ENGAZ_REPORTS_API_KEY (preferred) or
#      VITE_REPORTS_API_KEY. The desktop reads it from there at runtime, in the main
#      process, where it never reaches a renderer.
#
# The portal (reporting.engaz.tech) MUST NOT hold this key. It is a static site published as
# a public bundle, and the same bundle is served from menu.engaz.tech — any VITE_* value in
# it is readable by every visitor who opens devtools. That is why the portal build fails on
# purpose when VITE_REPORTS_API_KEY reaches its output (scripts/build-reports.mjs sets a
# sentinel value and then greps the build for it), and why reports-site/vite.config.ts
# exposes only VITE_REPORTS_WORKER_URL. Portal viewers authenticate with
# REPORTS_VIEWER_PASSWORD and are given a short-lived read-only token instead.
#
# An earlier version of this file told the operator to set VITE_REPORTS_API_KEY for the
# portal. That instruction is what killed the mirror: following it made the modern build fail
# its sentinel check, the operator concluded the variable "breaks the build" and left it
# unset, and mockApiService.cjs — which reads that one variable as its only source for the
# reports key — then mirrored nothing, silently.
