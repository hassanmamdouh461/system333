name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # better-sqlite3 is a native module the Electron layer needs, so a plain `npm ci`
      # has to build it. Failing here is a real signal, not CI noise.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  reports-portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reports-site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: reports-site/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The portal has its own stricter tsconfig, and `vite build` does not typecheck.
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Build
        run: npm run build
