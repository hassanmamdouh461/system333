name = "engaz-d1-proxy"
main = "cloudflare/d1-proxy-worker.js"
compatibility_date = "2025-01-01"

# ── CUTOVER: read this before deploying ───────────────────────────────────────────────
# This worker holds every order, customer, stock level and loyalty balance in the business.
# It used to be published on its Cloudflare-provided *.workers.dev URL, which anyone on the
# internet can reach by name and which sits outside every Access policy, WAF rule and rate
# limit scoped to engaz.tech — while both less sensitive workers (the reports API and the
# reporting portal) had workers_dev deliberately switched off for exactly that reason.
#
# It now answers on api-pos.engaz.tech only. api.engaz.tech is deliberately NOT used: that
# hostname is already serving another service, and claiming its route would take it down.
#
# Order of operations — doing these out of order is an outage:
#   1. Point every POS device at https://api-pos.engaz.tech (settings → worker URL).
#      electron/workerHostPolicy.cjs already allows this host, so no desktop rebuild is
#      needed and a device can be moved one at a time.
#   2. Deploy. The worker stops answering on *.workers.dev the moment this config lands.
#   3. Verify https://api-pos.engaz.tech/health and a real sync from one device.
#
# A device still carrying the old *.workers.dev URL after step 2 stops syncing entirely.
# The host allowlist cannot rescue it, because the hostname itself ceases to exist.
workers_dev = false

routes = [
  { pattern = "api-pos.engaz.tech/*", zone_name = "engaz.tech" },
]

# Cloudflare D1 database used by the desktop POS (writes) and the manager portal (reads).
# The binding name must stay `DB` -- the worker reads env.DB.
#
# This database was created on 2026-09-14 to back the POS sync that the legacy
# brewmaster-d1-proxy could no longer serve (different contract, returned HTTP 400
# "Missing sql or batch"). The id is now in source because the database is the worker.
[[d1_databases]]
binding = "DB"
database_name = "engaz-pos-db"
database_id = "6e8450b3-2b08-46f2-8b80-a85ccce6b21f"

# Local dev origins are refused unless this is explicitly "true". The worker reads it, so
# without the declaration the setting could never be turned on for a dev deployment.
[vars]
ALLOW_DEV_ORIGINS = "false"

# Secrets are never in this file. Set once per environment:
#   npx wrangler secret put WORKER_API_KEY